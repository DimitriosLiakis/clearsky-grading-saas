version: "3.8"
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: googleauth-rabbitmq
    ports:
      - "5673:5672"
      - "15673:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  google_auth_service:
    build: .
    container_name: google_auth_service
    ports:
      - "8086:8086"
    depends_on:
      - rabbitmq
    environment:
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
